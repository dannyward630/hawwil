name: Bug report | بلاغ خطأ
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Which tool? | أي أداة؟
      placeholder: Merge PDF, HEIC to JPG, ...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? | ماذا حدث؟
      description: Steps to reproduce, and what you expected.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device | المتصفح والجهاز
      placeholder: Chrome 130 on Windows 11, Safari on iPhone 15
  - type: input
    id: file
    attributes:
      label: File type and size | نوع الملف وحجمه
      description: Do not attach private files.
